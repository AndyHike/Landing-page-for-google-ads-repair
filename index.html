<!DOCTYPE html>
<html lang="cs">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Prémiová péče o vaše zařízení" />
  <title>Prémiová Péče o Zařízení</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="/index.css">
</head>

<body class="bg-white text-slate-900 antialiased">
  <div id="root">
    <!-- Inline Loading Skeleton to give instant FCP -->
    <div style="min-height: 100vh; display: flex; flex-direction: column;">
      <div style="height: 80px; width: 100%; background-color: #f8fafc; border-bottom: 1px solid #f1f5f9;"></div>
      <div
        style="display: flex; flex-direction: column; align-items: center; justify-content: center; flex-grow: 1; padding: 2rem;">
        <div
          style="width: 60px; height: 60px; border: 4px solid #f1f5f9; border-top-color: #0f172a; border-radius: 50%; animation: spin 1s linear infinite;">
        </div>
        <style>
          @keyframes spin {
            0% {
              transform: rotate(0deg);
            }

            100% {
              transform: rotate(360deg);
            }
          }
        </style>
      </div>
    </div>
  </div>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
